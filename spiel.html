<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>T.CON Berufe-Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --brand1: #00B7F3;
      --brand2: #BFBFBF;
      --bg1: #1f2a44;
      --bg2: #121826;
      --text: #ffffff;
      --muted: #c8c8c8;
      --radius: 18px;
      --shadow: 0 10px 28px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", Roboto, Arial;
      background:
        linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)),
        url("Hintergrund.png") no-repeat center/cover fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 1150px;
    }

    /* ================================================= */
    /* HEADER – modernes Blue‑Theme                       */
    /* ================================================= */

    .header {
      background: var(--bg1);
      padding: 32px;
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
      position: relative;
    }

    /* Home Button */
    .home-btn {
      position: absolute;
      top: 32px;
      right: 32px;
      background: linear-gradient(135deg, var(--brand1), rgba(0, 183, 243, .55));
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: .2s;
      box-shadow: 0 4px 16px rgba(0, 183, 243, .4);
      font-size: 16px;
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 183, 243, .5);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .header {
        padding: 24px;
      }

      .home-btn {
        top: 24px;
        right: 24px;
        padding: 10px 20px;
        font-size: 14px;
      }

      .header h1 {
        font-size: 22px;
        padding-right: 90px;
        /* Platz für den Home-Button */
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .tile {
        padding: 18px;
      }

      .tile h3 {
        font-size: 18px;
      }

      .card {
        padding: 18px;
      }

      .paper {
        padding: 14px;
      }

      .question {
        font-size: 18px;
      }

      .btn {
        padding: 14px;
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .header {
        padding: 18px;
        border-radius: 16px;
      }

      .home-btn {
        top: 18px;
        right: 18px;
        padding: 8px 14px;
        font-size: 12px;
      }

      .header h1 {
        font-size: 16px;
        padding-right: 70px;
        line-height: 1.3;
      }

      .nav {
        flex-wrap: wrap;
        gap: 6px;
        padding: 4px;
      }

      .seg {
        font-size: 12px;
        padding: 8px 10px;
        flex: 1 1 auto;
        min-width: calc(50% - 3px);
      }

      .grid {
        gap: 12px;
      }

      .tile {
        padding: 16px;
        border-radius: 16px;
      }

      .tile h3 {
        font-size: 16px;
      }

      .card {
        padding: 14px;
        border-radius: 16px;
      }

      .paper {
        padding: 12px;
        border-radius: 14px;
      }

      .question {
        font-size: 16px;
      }

      .btn {
        padding: 12px;
        font-size: 14px;
        margin: 6px 0;
      }

      .info {
        font-size: 13px;
        padding: 10px;
      }

      .progressWrap {
        gap: 8px;
        flex-direction: column;
        align-items: stretch;
      }

      .progressBar {
        height: 8px;
      }

      .actions {
        flex-direction: column;
      }

      .actionBtn {
        width: 100%;
        padding: 12px;
      }
    }

    @media (max-width: 360px) {
      .header h1 {
        font-size: 14px;
        padding-right: 65px;
      }

      .home-btn {
        padding: 6px 10px;
        font-size: 11px;
      }

      .seg {
        font-size: 11px;
        padding: 6px 8px;
      }

      .tile h3 {
        font-size: 15px;
      }

      .question {
        font-size: 15px;
      }

      .btn {
        font-size: 13px;
        padding: 10px;
      }
    }

    /* neue Überschrift */
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      margin: 0;
      line-height: 1.28;
    }

    .header .accent {
      color: var(--brand1);
    }

    /* Navigation */
    .nav {
      margin-top: 18px;
      background: rgba(255, 255, 255, .08);
      padding: 6px;
      border-radius: 14px;
      display: flex;
      gap: 10px;
    }

    .seg {
      background: transparent;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: .2s;
    }

    .seg.active {
      background: linear-gradient(135deg, var(--brand1), rgba(0, 183, 243, .55));
      box-shadow: 0 4px 16px rgba(0, 183, 243, .4);
    }

    .seg:hover {
      transform: translateY(-1px);
    }

    /* ================================================= */
    /* HOME KACHELN (ohne Buttons)                       */
    /* ================================================= */

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .tile {
      background: var(--bg1);
      padding: 22px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      transition: .2s ease;
      cursor: pointer;
    }

    .tile:hover {
      transform: translateY(-4px);
    }

    .tile h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    /* ================================================= */
    /* QUIZ BEREICH                                      */
    /* ================================================= */

    .card {
      background: rgba(255, 255, 255, .10);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-top: 18px;
      border: 1px solid var(--bg2);
    }

    .paper {
      background: var(--bg2);
      border-radius: 18px;
      padding: 18px;
      margin-top: 14px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
    }

    .question {
      font-size: 20px;
      font-weight: 800;
      text-align: center;
    }

    /* Antwortbuttons */
    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      margin: 8px 0;
      cursor: pointer;
      transition: .15s;
    }

    .btn:hover {
      filter: brightness(1.15);
    }

    .btn.si {
      background: #0054d8;
      color: white;
    }

    .btn.ae {
      background: #5e3aff;
      color: white;
    }

    .btn.dm {
      background: #0fa76a;
      color: white;
    }

    .btn.is-correct {
      outline: 2px solid #23d4a1;
    }

    .btn.is-wrong {
      outline: 2px solid #ff4d4d;
      opacity: .8;
    }

    .btn.is-dim {
      opacity: .55;
    }

    .info {
      background: rgba(255, 255, 255, .12);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      font-size: 14px;
    }

    /* Progress Bar */
    .progressWrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progressBar {
      flex: 1;
      height: 10px;
      background: rgba(255, 255, 255, .50);
      border-radius: 999px;
    }

    .progressFill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--brand1), var(--brand2));
    }

    /* Bottom Buttons */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      color: white;
    }

    .actionBtn {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .25);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      color: white;
    }

    .actionBtn:hover {
      background: rgba(255, 255, 255, .18);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* ========================================================= */
    /* FIX: Startseite sitzt zu weit unten / Hintergrund zu hoch */
    /* ========================================================= */

    #home.section.active {
      margin-top: -18px;
      /* HOME näher an Header schieben */
    }

    #home .grid {
      margin-top: 6px;
      /* weniger Abstand */
    }

    #home .tile {
      margin-top: 0;
      /* keine unnötigen Abstände */
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <div class="header">
      <button class="home-btn" onclick="window.location.href='index.html'">Eignungstest</button>
      <h1>
        Entdecke unsere <span class="accent">Ausbildungsberufe</span> bei T.CON
      </h1>

      <div class="nav" id="nav">
        <button class="seg active" data-target="home" onclick="showSection('home')">Start</button>
        <button class="seg" data-target="si" onclick="showSection('si')">Systemintegration</button>
        <button class="seg" data-target="ae" onclick="showSection('ae')">Anwendungsentwicklung</button>
        <button class="seg" data-target="dm" onclick="showSection('dm')">Digitalisierung</button>
      </div>
    </div>

    <!-- HOME -->
    <section id="home" class="section active">

      <div class="grid">

        <div class="tile" onclick="showSection('si')">
          <h3>Fachinformatiker für Systemintegration</h3>
        </div>

        <div class="tile" onclick="showSection('ae')">
          <h3>Fachinformatiker für Anwendungsentwicklung</h3>
        </div>

        <div class="tile" onclick="showSection('dm')">
          <h3>Kaufmann/-frau für Digitalisierungsmanagement</h3>
        </div>

      </div>
    </section>

    <!-- ==================== SI GAME ==================== -->
    <section id="si" class="section">
      <div class="card">
        <div class="progressWrap">
          <div class="progressBar">
            <div id="si_prog" class="progressFill"></div>
          </div>
          <div id="si_prog_label" class="progressLabel">Frage 1/6</div>
          <div id="si_score" class="progressLabel">Punkte: 0</div>
        </div>

        <div class="paper">
          <div id="si_q" class="question"></div>
          <button id="si_opt1" class="btn si"></button>
          <button id="si_opt2" class="btn si"></button>
          <button id="si_opt3" class="btn si"></button>
          <div id="si_info" class="info"></div>
        </div>

        <div class="actions">
          <button class="actionBtn" onclick="resetGame('si')">Wiederholen</button>
          <button class="actionBtn" onclick="showSection('home')">Home</button>
        </div>
      </div>
    </section>

    <!-- ==================== AE GAME ==================== -->
    <section id="ae" class="section">
      <div class="card">
        <div class="progressWrap">
          <div class="progressBar">
            <div id="ae_prog" class="progressFill"></div>
          </div>
          <div id="ae_prog_label" class="progressLabel">Frage 1/6</div>
          <div id="ae_score" class="progressLabel">Punkte: 0</div>
        </div>

        <div class="paper">
          <div id="ae_q" class="question"></div>
          <button id="ae_opt1" class="btn ae"></button>
          <button id="ae_opt2" class="btn ae"></button>
          <button id="ae_opt3" class="btn ae"></button>
          <div id="ae_info" class="info"></div>
        </div>

        <div class="actions">
          <button class="actionBtn" onclick="resetGame('ae')">Neu</button>
          <button class="actionBtn" onclick="showSection('home')">Start</button>
        </div>
      </div>
    </section>

    <!-- ==================== DM GAME ==================== -->
    <section id="dm" class="section">
      <div class="card">
        <div class="progressWrap">
          <div class="progressBar">
            <div id="dm_prog" class="progressFill"></div>
          </div>
          <div id="dm_prog_label" class="progressLabel">Frage 1/6</div>
          <div id="dm_score" class="progressLabel">Punkte: 0</div>
        </div>

        <div class="paper">
          <div id="dm_q" class="question"></div>
          <button id="dm_opt1" class="btn dm"></button>
          <button id="dm_opt2" class="btn dm"></button>
          <button id="dm_opt3" class="btn dm"></button>
          <div id="dm_info" class="info"></div>
        </div>

        <div class="actions">
          <button class="actionBtn" onclick="resetGame('dm')">Neu</button>
          <button class="actionBtn" onclick="showSection('home')">Start</button>
        </div>
      </div>
    </section>

  </div>

  <script>
    /* ========================== */
    /* Navigation / Section Swap */
    /* ========================== */
    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');

      document.querySelectorAll('#nav .seg').forEach(b => {
        b.classList.toggle('active', b.dataset.target === id);
      });

      if (id === 'si' && !si_state.started) start_si();
      if (id === 'ae' && !ae_state.started) start_ae();
      if (id === 'dm' && !dm_state.started) start_dm();
    }

    /* Helpers */
    function shuffle(a) { return a.sort(() => Math.random() - 0.5); }

    /* Universal feedback */
    function choose_with_feedback(btnIds, clickedIdx, info, who) {
      btnIds.forEach((id, i) => {
        const el = document.getElementById(id);
        el.disabled = true;
        const ok = el.dataset.ok === "1";
        if (i === clickedIdx) el.classList.add(ok ? 'is-correct' : 'is-wrong');
        else {
          el.classList.add('is-dim');
          if (ok) el.classList.add('is-correct');
        }
      });

      document.getElementById(`${who}_info`).innerText = info;

      const isCorrect = document.getElementById(btnIds[clickedIdx]).dataset.ok === "1";
      if (who === 'si') { if (isCorrect) si_state.points++; si_state.i++; setTimeout(render_si, 1100); }
      if (who === 'ae') { if (isCorrect) ae_state.points++; ae_state.i++; setTimeout(render_ae, 1100); }
      if (who === 'dm') { if (isCorrect) dm_state.points++; dm_state.i++; setTimeout(render_dm, 1100); }

      document.getElementById(`${who}_score`).innerText = "Punkte: " + (who === 'si' ? si_state.points : who === 'ae' ? ae_state.points : dm_state.points);
    }

    /* ================= SI ================= */

    const si_pool = [
      {
        q: "Der PC geht an, aber der Bildschirm bleibt komplett schwarz.",
        answers: [
          { text: "Stromkabel, Monitoranschluss und Power‑Button zuerst prüfen.", type: 'correct' },
          { text: "Sofort einen neuen PC bestellen.", type: 'wrong' },
          { text: "Bis morgen warten – vielleicht geht es dann.", type: 'funny' }],
        info: "🧠 Erst die einfachen Hardware‑Sachen prüfen: Strom, Kabel, Monitor."
      },
      {
        q: "Der Mitarbeiter sagt: „Das WLAN ist so langsam, Webseiten laden kaum.“",
        answers: [
          { text: "Router‑Standort und Störungen prüfen, Verbindung testen.", type: 'correct' },
          { text: "Einfach ignorieren – wird schon schneller.", type: 'wrong' },
          { text: "Fenster öffnen – frische Luft für WLAN.", type: 'funny' }],
        info: "📶 Häufige Ursachen: Entfernung, Wände, andere Geräte. Erst testen."
      },
      {
        q: "Der Druckauftrag wird gesendet, aber es kommt kein Ausdruck.",
        answers: [
          { text: "Papier/Toner/Kabel und die Drucker‑Warteschlange prüfen.", type: 'correct' },
          { text: "20× auf „Drucken“ klicken.", type: 'wrong' },
          { text: "Den Drucker nett anlächeln.", type: 'funny' }],
        info: "🖨️ Standard‑Check: Status, Toner, Papier, Queue."
      },
      {
        q: "Der Benutzer kann sich nicht einloggen. Eine Fehlermeldung erscheint.",
        answers: [
          { text: "Fehlermeldung lesen und Passwort/Accountstatus prüfen.", type: 'correct' },
          { text: "Für alle das Passwort auf „1234“ setzen.", type: 'wrong' },
          { text: "Vielleicht hat die Tastatur Montag.", type: 'funny' }],
        info: "🔐 Erst verstehen, warum der Login scheitert (Fehlermeldung lesen)."
      },
      {
        q: "Ein Programm öffnet sich nicht – beim Start passiert gar nichts.",
        answers: [
          { text: "Fehlermeldung prüfen, Updates suchen, Neustart testen.", type: 'correct' },
          { text: "Gleich das ganze Betriebssystem neu installieren.", type: 'wrong' },
          { text: "Den PC mit Snacks motivieren.", type: 'funny' }],
        info: "⚙️ Erst einfache Software‑Checks (Updates, Neustart)."
      },
      {
        q: "Eine Kollegin sagt: „Ich kann keine E‑Mails mehr senden oder empfangen.“",
        answers: [
          { text: "Internet, Speicherplatz und Postfachgröße prüfen.", type: 'correct' },
          { text: "Alle Mails löschen – ohne zu prüfen.", type: 'wrong' },
          { text: "Mehr Drucker kaufen – für E‑Mails.", type: 'funny' }],
        info: "📧 Meist sind Verbindung oder Speicher voll – zuerst prüfen."
      },
      {
        q: "Maus oder Tastatur reagieren plötzlich nicht mehr.",
        answers: [
          { text: "Batterie/Kabel prüfen, anderen USB‑Port testen.", type: 'correct' },
          { text: "Einmal kräftig pusten – das hilft sicher.", type: 'wrong' },
          { text: "Die Maus mit Käse locken.", type: 'funny' }],
        info: "🖱️ Peripherie: Strom/Kabel/Port zuerst prüfen."
      },
      {
        q: "Der Monitor flackert oder wird kurz schwarz.",
        answers: [
          { text: "Kabel prüfen, anderen Monitor testen, Grafik‑Einstellungen checken.", type: 'correct' },
          { text: "Helligkeit maximal – hilft bestimmt.", type: 'wrong' },
          { text: "Dem Monitor zuzwinkern.", type: 'funny' }],
        info: "🖥️ Ursache oft Kabel/Hardware – logisch eingrenzen."
      },
      {
        q: "Der Mitarbeiter sagt: „Ich komme nicht ins Internet. Webseiten laden nicht.“",
        answers: [
          { text: "LAN/WLAN prüfen, Router testen, IP‑Einstellungen ansehen.", type: 'correct' },
          { text: "Sofort neuen Router kaufen.", type: 'wrong' },
          { text: "Internet mit Magneten anziehen.", type: 'funny' }],
        info: "🌐 Erst lokal prüfen, dann das Netzwerk."
      },
      {
        q: "Es ist kein Ton zu hören – egal ob Video oder Musik.",
        answers: [
          { text: "Lautstärke, Ausgabegerät, Kabel/Bluetooth prüfen.", type: 'correct' },
          { text: "Kopfhörer zerschneiden – sicher ist sicher.", type: 'wrong' },
          { text: "Den Laptop anschmunzeln.", type: 'funny' }],
        info: "🔊 Häufig ist das falsche Ausgabegerät gewählt."
      }
    ];

    let si_questions = [], si_state = { i: 0, points: 0, started: false, total: 4 };

    function start_si() {
      si_questions = shuffle([...si_pool]).slice(0, 6);   // <-- nur 6 Fragen
      si_state = { i: 0, points: 0, started: true, total: 6 };  // <-- total = 6
      render_si();
      update_si_progress();
      document.getElementById('si_score').innerText = "Punkte: 0";
    }

    function update_si_progress() {
      const pct = (si_state.i / si_state.total) * 100;
      document.getElementById('si_prog').style.width = pct + "%";
      document.getElementById('si_prog_label').innerText = `Frage ${Math.min(si_state.i + 1, si_state.total)}/${si_state.total}`;
    }

    function render_si() {
      if (si_state.i >= si_state.total) return end_si();
      const s = si_questions[si_state.i];
      document.getElementById('si_q').innerText = s.q;
      document.getElementById('si_info').innerText = "";
      const opts = shuffle(s.answers.map(a => ({ text: a.text, ok: a.type === 'correct' })));

      ['si_opt1', 'si_opt2', 'si_opt3'].forEach((id, i) => {
        const b = document.getElementById(id);
        b.disabled = false;
        b.classList.remove('is-correct', 'is-wrong', 'is-dim');
        b.innerText = opts[i].text;
        b.dataset.ok = opts[i].ok ? '1' : '0';
        b.onclick = () => choose_with_feedback(['si_opt1', 'si_opt2', 'si_opt3'], i, s.info, 'si');
      });

      update_si_progress();
    }

    function end_si() {
      document.getElementById('si_prog').style.width = '100%';
      document.getElementById('si_prog_label').innerText = "Fertig";

      document.getElementById('si_q').innerHTML =
        `Du hast <b>${si_state.points}/${si_state.total}</b> Punkten erreicht.`;

      const b1 = document.getElementById('si_opt1');
      const b2 = document.getElementById('si_opt2');
      const b3 = document.getElementById('si_opt3');

      [b1, b2, b3].forEach(b => {
        b.disabled = false;
        b.classList.remove('is-correct', 'is-wrong', 'is-dim');
      });

      b1.innerText = "Neu starten"; b1.onclick = () => resetGame('si');
      b2.innerText = "Zurück"; b2.onclick = () => showSection('home');
      b3.style.display = 'none';
    }

    /* ================= AE ================= */

    const ae_pool = [
      {
        q: "Ein Button wird geklickt – aber die App reagiert nicht.",
        answers: [
          { text: "Prüfen, ob die Ereignis‑Funktion wirklich ausgelöst wird.", type: 'correct' },
          { text: "Alles neu programmieren – ohne zu testen.", type: 'wrong' },
          { text: "Kurz Pause, dann nochmal probieren.", type: 'funny' }],
        info: "🧠 Erst checken: Wird der Code überhaupt ausgeführt?"
      },
      {
        q: "Du sollst einen Login bauen. Was ist der erste sinnvolle Schritt?",
        answers: [
          { text: "Logik planen: Eingabe → Prüfung → Ergebnis.", type: 'correct' },
          { text: "Ohne Plan losprogrammieren.", type: 'wrong' },
          { text: "Erst das Logo animieren.", type: 'funny' }],
        info: "📋 Planung spart Zeit und Fehler."
      },
      {
        q: "Wenn das Textfeld leer bleibt, stürzt die App direkt ab.",
        answers: [
          { text: "Eingaben prüfen und eine klare Fehlermeldung anzeigen.", type: 'correct' },
          { text: "Fehler ignorieren – passiert halt.", type: 'wrong' },
          { text: "Leere Felder bunt färben.", type: 'funny' }],
        info: "✅ Eingaben validieren = Standard."
      },
      {
        q: "Du schreibst eine Funktion, die etwas berechnet.",
        answers: [

    let ae_questions = [], ae_state = { i: 0, points: 0, started: false, total: 1 };

      ae_questions = shuffle([...ae_pool]).slice(0, 6);

      render_ae();
      update_ae_progress();
      document.getElementById('ae_score').innerText = "Punkte: 0";
    }


    function update_ae_progress() {
      const pct = (ae_state.i / ae_state.total) * 100;
      document.getElementById('ae_prog').style.width = pct + "%";
      document.getElementById('ae_prog_label').innerText = `Frage ${Math.min(ae_state.i + 1, ae_state.total)}/${ae_state.total}`;
    }

    function render_ae() {
      if (ae_state.i >= ae_state.total) return end_ae();
      const s = ae_questions[ae_state.i];
      document.getElementById('ae_q').innerText = s.q;
      document.getElementById('ae_info').innerText = "";
      const opts = shuffle(s.answers.map(a => ({ text: a.text, ok: a.type === 'correct' })));

      ['ae_opt1', 'ae_opt2', 'ae_opt3'].forEach((id, i) => {
        const b = document.getElementById(id);
        b.disabled = false;
        b.classList.remove('is-correct', 'is-wrong', 'is-dim');
        b.innerText = opts[i].text;
        b.dataset.ok = opts[i].ok ? '1' : '0';
        b.onclick = () => choose_with_feedback(['ae_opt1', 'ae_opt2', 'ae_opt3'], i, s.info, 'ae');
      });

      update_ae_progress();
    }

      document.getElementById('ae_prog').style.width = '100%';
      document.getElementById('ae_prog_label').innerText = "Fertig";

      const b2 = document.getElementById('ae_opt2');
      const b3 = document.getElementById('ae_opt3');

      [b1, b2, b3].forEach(b => {

      b1.innerText = "Neu starten"; b1.onclick = () => resetGame('ae');
      b2.innerText = "Zurück"; b2.onclick = () => showSection('home');

    /* Reset */
    function resetGame(which) {
      ['opt1', 'opt2', 'opt3'].forEach(o => {
        const b = document.getElementById(`${which}_${o}`);
        if (b) {
          b.disabled = false;
          b.classList.remove('is-correct', 'is-wrong', 'is-dim');
          b.style.display = 'block';
        }
      });

      if (which === 'si') { si_state.started = false; start_si(); }
      if (which === 'ae') { ae_state.started = false; start_ae(); }
      if (which === 'dm') { dm_state.started = false; start_dm(); }
